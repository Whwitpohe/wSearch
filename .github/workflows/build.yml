name: Build desktop releases
on:
  push:
    tags: ["[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build on all desktop platforms
        required: true
        type: string
      target:
        description: Optional single platform-architecture to build as a CI artifact
        type: string
        required: false
      artifact_runs:
        description: Publish previously verified builds of this tag from these comma-separated workflow run IDs
        type: string
        required: false
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      tag: ${{ steps.targets.outputs.tag }}
    steps:
      - id: targets
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SINGLE_TARGET: ${{ inputs.target }}
          ARTIFACT_RUNS: ${{ inputs.artifact_runs }}
        run: |
          import json, os, re
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?", tag):
              raise SystemExit("Expected a version tag")
          if os.environ.get("ARTIFACT_RUNS") and (os.environ.get("SINGLE_TARGET") or not re.fullmatch(r"[0-9]+(?:,[0-9]+){0,5}", os.environ["ARTIFACT_RUNS"])):
              raise SystemExit("Specify build run IDs or a single build target")
          rows = [
              ("ubuntu-24.04", "linux", "x64"), ("ubuntu-24.04-arm", "linux", "arm64"),
              ("macos-15-intel", "darwin", "x64"), ("macos-15", "darwin", "arm64"),
              ("windows-latest", "win32", "x64"), ("windows-11-arm", "win32", "arm64"),
          ]
          targets = [dict(runner=r, platform=p, arch=a) for r,p,a in rows]
          if os.environ.get("SINGLE_TARGET"):
              targets = [t for t in targets if f"{t['platform']}-{t['arch']}" == os.environ["SINGLE_TARGET"]]
              if not targets:
                  raise SystemExit("Unknown desktop build target")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("matrix=" + json.dumps({"include": targets}), file=out)
              print("tag=" + tag, file=out)

  build:
    needs: plan
    if: ${{ !inputs.artifact_runs }}
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      M_ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      USE_HARD_LINKS: false
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libx11-dev libxext-dev libxtst-dev libxrender-dev libxmu-dev libxmuu-dev rpm libarchive-tools
      - name: Install, test and build on the target architecture
        run: |
          node -e "if (process.arch !== process.env.M_ARCH || require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
          pnpm exec electron-builder --publish never --config electron-builder.config.js
          pnpm exec electron-builder --publish never --config electron-builder.offline.config.js
      - name: Verify release files
        shell: python
        env:
          TARGET: ${{ matrix.platform }}
        run: |
          import os, pathlib, shutil, subprocess, zipfile
          platform = os.environ["TARGET"]
          extensions = {"linux":["AppImage","deb","rpm","tar.gz"],"darwin":["dmg","zip"],"win32":["exe","zip"]}[platform]
          arch = os.environ["M_ARCH"]
          prefix = "wSearch-{}-{}-".format(os.environ["RELEASE_TAG"], platform)
          dest = pathlib.Path("release-files")
          dest.mkdir()
          for directory, suffix in [("build", ""), ("build/offline", "-offline")]:
              for ext in extensions:
                  name = f"{prefix}{arch}{suffix}.{ext}"
                  aliases = {"x64": ("x64", "x86_64", "amd64"), "arm64": ("arm64", "aarch64")}[arch]
                  candidates = [pathlib.Path(directory) / f"{prefix}{alias}{suffix}.{ext}" for alias in aliases]
                  found = [p for p in candidates if p.is_file() and p.stat().st_size > 1_000_000]
                  if len(found) != 1:
                      raise SystemExit(f"Expected one package for {name}; found {found}")
                  src = found[0]
                  if ext in ("rpm", "deb"):
                      native_arch = {"rpm": {"x64": "x86_64", "arm64": "aarch64"}, "deb": {"x64": "amd64", "arm64": "arm64"}}[ext][arch]
                      cmd = ["rpm", "-qp", "--qf", "%{ARCH}", str(src)] if ext == "rpm" else ["dpkg-deb", "-f", str(src), "Architecture"]
                      if subprocess.check_output(cmd, text=True).strip() != native_arch:
                          raise SystemExit(f"Wrong architecture: {src}")
                  if ext == "zip":
                      with zipfile.ZipFile(src) as z:
                          if z.testzip() is not None: raise SystemExit("Invalid ZIP")
                  shutil.move(src, dest / name)
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-files/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && !inputs.target && (needs.build.result == 'success' || (inputs.artifact_runs && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.artifact_runs }}
        with:
          pattern: packages-*
          path: release-files
          merge-multiple: true
      - name: Recover verified packages for this tag
        if: ${{ inputs.artifact_runs }}
        env:
          ARTIFACT_RUNS: ${{ inputs.artifact_runs }}
        run: python3 script/collect-release-artifacts.py
      - name: Publish the verified packages
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          (cd release-files && sha256sum wSearch-* > SHA256SUMS.txt)
          bash script/release-notes.sh "$TAG" "$notes"
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent
          release_id=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name==env.TAG) | .id')
          if test -z "$release_id"; then
            release_id=$(gh api --method POST "repos/$GH_REPO/releases" -f tag_name="$TAG" -f name="wSearch $TAG" -F draft=true -F "body=@$notes" --jq .id)
          fi
          for file in release-files/*; do
            name=$(basename "$file")
            remote=$(gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100" --jq ".[] | select(.name==\"$name\") | .digest")
            if test -n "$remote"; then
              test "$remote" = "sha256:$(sha256sum "$file" | cut -d ' ' -f 1)" || { echo "Asset already exists with different contents: $name"; exit 1; }
            else
              gh release upload "$TAG" "$file"
            fi
          done
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -f tag_name="$TAG" -f name="wSearch $TAG" -F "body=@$notes" -F draft=false -F prerelease=false -f make_latest=true --silent
