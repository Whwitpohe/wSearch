<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"><title>eSearch</title>
<style>
* { box-sizing: border-box; }
html { background: transparent; }
body {
    margin: 0; width: max-content; display: flex; flex-direction: column;
    align-items: center; gap: 3px; background: transparent; overflow: hidden;
    color: #fff; font: 13px/1.4 "Segoe UI", "Microsoft YaHei UI", sans-serif;
}
#status {
    display: flex; align-items: center; gap: 4px; width: max-content; max-width: 100%;
    padding: 4px 5px 4px 11px; border-radius: 12px;
    background: rgb(28 33 43 / 74%); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 13%);
}
#status span {min-width: 0; overflow-wrap: anywhere; max-height: 5.6em; overflow-y:auto;}
button,input {font:inherit;color:inherit;}
#status button {
    flex: none; display:grid;place-items:center; padding:0; width:20px; height:20px;
    border:0; border-radius:50%;background:transparent;color:#e4e8ee; cursor:pointer;
}
#status button:hover {background:rgb(255 255 255 / 16%);}
.actions {
    display:flex; align-items:center; flex-wrap:wrap; gap:3px; width:max-content; max-width:100%;
    padding:5px 7px; border:1px solid #526079; border-radius:8px; background:rgb(32 39 55 / 96%);
}
.actions button,.actions input {background:#333e53;border:1px solid #526079;border-radius:5px;}
.actions button {width:30px;height:30px;padding:5px;cursor:pointer;}
.actions button:hover {background:#536789;}
button:focus-visible,input:focus-visible {outline:2px solid #a8c5ff;outline-offset:-2px;}
.actions img {width:17px;height:17px;filter:brightness(0) invert(1);}
.actions input {width:43px;height:28px;font-size:12px;padding:1px 3px;}
.actions label {display:flex;gap:2px;align-items:center;font-size:11px;color:#cbd7f0;}
.actions label img {width:15px;height:15px;}
.actions label span {font-size:10px;}
[hidden] {display:none !important;}
</style></head><body><div id="status" hidden><span role="status"></span><button type="button">×</button></div><div class="actions" hidden></div><script type="module" src="./ding/panel.ts"></script></body></html>
